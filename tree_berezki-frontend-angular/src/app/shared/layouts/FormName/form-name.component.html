<form class="form-name__container" [formGroup]="nameForm" novalidate (ngSubmit)="submit()">
  <div class="form-name__input form-name__phone">
    <input-shelf-ui
      size="large_24"
      background="dark"
      type="text"
      placeholder="Имя"
      width="350px"
      [errorMessage]="isInvalidName ? '1' : ''"
      [isPlaceholderOnInput]="isPlaceholderOnName"
    ><input
      name="name"
      type="text"
      inputFocus
      (onFocus)="onFocusEventName()"
      (onEmpty)="onEmptyEventName()"
      (onBlur)="onBlurEventName()"
      class="input large_24 dark"
      minlength="1"
      maxlength="255"
      [attr.required]="true"
      formControlName="name"
    /></input-shelf-ui>
    @if(isInvalidName) {
      <text-ui type="danger" size="medium_16" back="dark">Некорректное имя</text-ui>
    }
  </div>
  <div class="form-name__input">
    @if(serverError) {
    <text-ui type="danger" size="medium_16" back="dark">{{ serverError }}</text-ui>
    }
    <button-ui type="primary" form="rounded" [disabled]="isDisabled" (onClick)="submit()">
      <div class="form-name__submit-button">
        <text-ui type="main" size="medium_16" back="light" [bold]="true">Продолжить</text-ui>
      </div>
    </button-ui>
  </div>
</form>
