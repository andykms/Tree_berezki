<div class="advert-info__container" mouseEnter (onMouseEnter)="onMouseEnterTitle()" (onMouseLeave)="onMouseLeaveTitle()">
  <text-ui type="main" size="small_10" back="light">{{title}}</text-ui>
  @if(isWatchInfo) {
      <div class="advert-info__about">
        <text-ui type="main" size="small_8">{{advertInfo.organization}}</text-ui>
        <text-ui type="main" size="small_8">{{advertInfo.INN}}</text-ui>
      </div>
  }
</div>
